name: Render video
on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID (খালি রাখলে শুধু লিস্ট দেখাবে)"
        required: false
        default: ""
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2
      - name: Unzip project
        run: |
          mkdir project
          unzip -q imam-ielts-remotion.zip -d project
          PKG=$(find project -name package.json -not -path "*/node_modules/*" | head -n 1)
          echo "PROJECT_DIR=$(dirname "$PKG")" >> $GITHUB_ENV
      - name: Install
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install
      - name: List compositions
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx remotion compositions
      - name: Render
        if: ${{ inputs.composition != '' }}
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          COMP: ${{ inputs.composition }}
        run: npx remotion render "$COMP" out/video.mp4
      - name: Upload video
        if: ${{ inputs.composition != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: ${{ env.PROJECT_DIR }}/out/video.mp4
